<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List by David</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--ink:#29243d;--muted:#817b9b;--paper:#fffaf0;--lav:#b9a7ff;--pink:#ff9fc8;--mint:#9be7c4;--yellow:#ffe28a;--line:#39334f;--shadow:5px 5px 0 var(--line)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Nunito,system-ui,sans-serif;background-color:#e9e3ff;background-image:linear-gradient(45deg,#dcd3ff 25%,transparent 25%),linear-gradient(-45deg,#dcd3ff 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dcd3ff 75%),linear-gradient(-45deg,transparent 75%,#dcd3ff 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}
button,input,textarea,select{font:inherit}.pixel{font-family:'Press Start 2P',monospace;line-height:1.6}.app{width:min(1050px,calc(100% - 30px));margin:34px auto 50px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.brand-icon{width:48px;height:48px;background:var(--yellow);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);display:grid;place-items:center;font-size:25px}.brand h1{font-size:clamp(13px,2vw,19px);margin:0}.date-chip{background:var(--paper);border:3px solid var(--line);padding:10px 13px;box-shadow:3px 3px 0 var(--line);font-weight:900;font-size:12px}
.hero{background:var(--lav);border:3px solid var(--line);box-shadow:var(--shadow);padding:26px 28px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;position:relative;overflow:hidden}.hero:after{content:'✦';font-size:100px;position:absolute;right:25%;top:-28px;opacity:.17}.hero h2{font-size:clamp(15px,2.3vw,23px);margin:0 0 9px;position:relative;z-index:1}.hero p{margin:0;font-weight:800;color:#443b68;position:relative;z-index:1}.hero-art{font-size:62px;filter:drop-shadow(4px 4px 0 #51456f);z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:22px 0}.stat{border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:15px 17px;background:var(--paper)}.stat:nth-child(2){background:#e4fff1}.stat:nth-child(3){background:#fff0f7}.stat-label{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.stat-num{font-family:'Press Start 2P';font-size:22px;margin-top:9px}
.layout{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}.panel{background:var(--paper);border:3px solid var(--line);box-shadow:var(--shadow)}.panel-head{padding:17px 19px;border-bottom:3px dashed #d6cfe4;display:flex;justify-content:space-between;align-items:center}.panel-head h3{font-size:11px;margin:0}.form-body{padding:19px}.field{margin-bottom:15px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:2px solid var(--line);background:white;padding:11px 12px;outline:none;border-radius:0;color:var(--ink);font-weight:700}.field textarea{resize:vertical;min-height:72px}.field input:focus,.field textarea:focus,.field select:focus{box-shadow:3px 3px 0 var(--lav)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:11px 14px;font-weight:900;cursor:pointer;transition:.12s; color:var(--ink)}.btn:active{transform:translate(3px,3px);box-shadow:none}.btn-primary{background:var(--mint);width:100%}.btn-small{padding:7px 10px;font-size:11px;background:var(--yellow)}.task-area{min-width:0}.toolbar{padding:14px 17px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:3px dashed #d6cfe4}.search{flex:1;min-width:140px;border:2px solid var(--line);padding:9px 11px;background:#fff;font-weight:700}.filters{display:flex;gap:6px}.filter{border:2px solid var(--line);background:#fff;padding:8px 10px;font-size:10px;font-weight:900;cursor:pointer}.filter.active{background:var(--lav)}.task-list{padding:13px;display:grid;gap:10px}

/* Styling Drag & Drop & Reorder */
.task{display:grid;grid-template-columns:18px 26px 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);padding:12px;background:#fff;box-shadow:2px 2px 0 #d8d1e7;transition:transform .12s, background .15s, border-color .15s}
.task.draggable{cursor:grab}
.task.draggable:active{cursor:grabbing}
.task.dragging{opacity:0.45;background:#f4f0ff;border-style:dashed}
.task.drag-over-top{border-top:4px solid var(--lav);transform:translateY(2px)}
.task.drag-over-bottom{border-bottom:4px solid var(--lav);transform:translateY(-2px)}
.drag-handle{color:var(--muted);font-weight:900;font-size:14px;letter-spacing:-2px;user-select:none;text-align:center;cursor:grab}
.task.done .drag-handle{opacity:0.3;cursor:default}

.task.done{opacity:.62;background:#f2f0f6}.check{width:23px;height:23px;border:2px solid var(--line);background:white;cursor:pointer;display:grid;place-items:center;font-weight:900;padding:0}.done .check{background:var(--mint)}.task-title{font-weight:900;font-size:14px;overflow-wrap:anywhere}.done .task-title{text-decoration:line-through}.task-desc{font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.task-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tag{font-size:9px;font-weight:900;padding:3px 6px;border:1px solid var(--line);background:#f1edff}.tag.high{background:#ffd5d5}.tag.medium{background:#fff0bd}.tag.low{background:#d9f7e9}.task-actions{display:flex;gap:4px;align-items:center}.icon-btn{border:2px solid var(--line);background:#fff;padding:5px 7px;cursor:pointer;font-size:11px;font-weight:900}.icon-btn:hover{background:var(--pink)}.icon-btn.move-btn{background:#f7f5ff;padding:5px 6px;font-size:10px}.icon-btn.move-btn:hover{background:var(--yellow)}.icon-btn:disabled{opacity:0.35;cursor:not-allowed;background:#eee}.empty{text-align:center;padding:42px 15px;color:var(--muted)}.empty .emoji{font-size:42px}.empty p{font-weight:900}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 17px;border-top:3px dashed #d6cfe4;font-size:10px;color:var(--muted);font-weight:900}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:white;padding:12px 18px;border:2px solid white;box-shadow:4px 4px 0 #8c7dbd;font-weight:900;font-size:12px;transition:.25s;z-index:5}.toast.show{transform:translateX(-50%) translateY(0)}.tiny{font-size:9px;color:var(--muted);font-weight:800;margin-top:12px;line-height:1.7}

@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding:21px}.hero-art{font-size:48px}.stats{gap:8px}.stat{padding:12px}.stat-num{font-size:17px}.topbar{align-items:flex-start}.date-chip{font-size:10px}.filters{width:100%}.filter{flex:1}}
@media(max-width:460px){.brand h1{font-size:11px}.date-chip{padding:8px}.stats{grid-template-columns:repeat(3,1fr)}.stat-label{font-size:8px}.stat-num{font-size:14px}.task{grid-template-columns:16px 24px 1fr}.task-actions{grid-column:2 / 4;justify-content:flex-end;margin-top:4px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-icon">🎮</div><h1 class="pixel">TO DO</h1></div>
    <div class="date-chip" id="today">LOADING...</div>
  </header>
  <section class="hero">
    <div><h2 class="pixel">YOUR DAILY QUEST</h2><p>Satu tugas selesai, satu langkah naik level! 🚀</p></div>
    <div class="hero-art">🧙‍♂️</div>
  </section>
  <section class="stats">
    <div class="stat"><div class="stat-label">Total Quest</div><div class="stat-num" id="totalCount">00</div></div>
    <div class="stat"><div class="stat-label">Completed</div><div class="stat-num" id="doneCount">00</div></div>
    <div class="stat"><div class="stat-label">Progress</div><div class="stat-num" id="progressCount">0%</div></div>
  </section>
  <div class="layout">
    <section class="panel">
      <div class="panel-head"><h3 class="pixel" id="formHeading">+ NEW QUEST</h3><span>📝</span></div>
      <form class="form-body" id="taskForm">
        <div class="field"><label for="taskTitle">Nama tugas *</label><input id="taskTitle" maxlength="90" placeholder="Contoh: Belajar JavaScript..." required></div>
        <div class="field"><label for="taskDesc">Catatan (opsional)</label><textarea id="taskDesc" maxlength="220" placeholder="Tulis detail kecil di sini..."></textarea></div>
        <div class="two">
          <div class="field"><label for="taskDate">Deadline</label><input id="taskDate" type="date"></div>
          <div class="field"><label for="taskPriority">Prioritas</label><select id="taskPriority"><option value="low">Santai</option><option value="medium" selected>Normal</option><option value="high">Penting!</option></select></div>
        </div>
        <button class="btn btn-primary" id="submitBtn" type="submit">⚔ TAMBAH QUEST</button>
        <button class="btn" id="cancelEdit" type="button" style="display:none;width:100%;margin-top:10px;background:#ffe2ee">BATAL EDIT</button>
        <div class="tiny">💾 Data tersimpan otomatis di browser ini menggunakan JSON (localStorage). Tidak perlu database/server.</div>
      </form>
    </section>
    <section class="panel task-area">
      <div class="panel-head"><h3 class="pixel">QUEST BOARD</h3><span style="font-size:11px;font-weight:800;color:var(--muted)">⇅ Geser urutan</span></div>
      <div class="toolbar">
        <input class="search" id="searchInput" placeholder="🔎 Cari quest...">
        <div class="filters">
          <button class="filter active" data-filter="all">SEMUA</button>
          <button class="filter" data-filter="active">AKTIF</button>
          <button class="filter" data-filter="done">SELESAI</button>
        </div>
      </div>
      <div class="task-list" id="taskList"></div>
      <div class="footer"><span id="remainingText">0 quest tersisa</span><button class="btn btn-small" id="clearDone">BERSIHKAN SELESAI</button></div>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
(() => {
  const STORAGE_KEY = 'pixelQuest.tasks.v1';
  let tasks = loadTasks();
  let filter = 'all';
  let editingId = null;
  let draggedId = null;

  const $ = id => document.getElementById(id);
  const titleInput = $('taskTitle'), descInput = $('taskDesc'), dateInput = $('taskDate'), priorityInput = $('taskPriority');

  function loadTasks() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(parsed) ? parsed.filter(t => t && typeof t.id === 'string' && typeof t.title === 'string') : [];
    } catch { return []; }
  }
  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    render();
  }
  function notify(message) {
    const toast = $('toast'); toast.textContent = message; toast.classList.add('show');
    clearTimeout(notify.timer); notify.timer = setTimeout(() => toast.classList.remove('show'), 2100);
  }
  function escapeHTML(value='') {
    return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function formatDate(value) {
    if (!value) return '';
    const d = new Date(value + 'T00:00:00');
    return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
  }

  // Fungsi memindahkan urutan tugas
  function moveTask(fromId, toId, insertAfter = false) {
    if (!fromId || !toId || fromId === toId) return;
    const fromIndex = tasks.findIndex(t => t.id === fromId);
    if (fromIndex === -1) return;

    const [movedItem] = tasks.splice(fromIndex, 1);
    let toIndex = tasks.findIndex(t => t.id === toId);
    if (toIndex === -1) {
      tasks.splice(fromIndex, 0, movedItem);
      return;
    }
    if (insertAfter) toIndex += 1;
    tasks.splice(toIndex, 0, movedItem);
    saveTasks();
  }

  function render() {
    const done = tasks.filter(t => t.done).length;
    const total = tasks.length;
    $('totalCount').textContent = String(total).padStart(2,'0');
    $('doneCount').textContent = String(done).padStart(2,'0');
    $('progressCount').textContent = total ? Math.round(done/total*100)+'%' : '0%';
    $('remainingText').textContent = `${total-done} quest tersisa`;

    const query = $('searchInput').value.trim().toLowerCase();
    const isFiltering = query !== '' || filter !== 'all';

    // Pisahkan tugas aktif dan selesai agar urutan manual di masing-masing grup tetap terjaga
    const activeTasks = tasks.filter(t => !t.done);
    const doneTasks = tasks.filter(t => t.done);
    const orderedTasks = [...activeTasks, ...doneTasks];

    const visible = orderedTasks.filter(t =>
      (filter === 'all' || (filter === 'done' ? t.done : !t.done)) &&
      (t.title.toLowerCase().includes(query) || (t.desc || '').toLowerCase().includes(query))
    );

    const list = $('taskList');
    if (!visible.length) {
      list.innerHTML = `<div class="empty"><div class="emoji">${tasks.length ? '🔍' : '🪹'}</div><p>${tasks.length ? 'Quest tidak ditemukan!' : 'Belum ada quest!'}</p><span>${tasks.length ? 'Coba kata kunci atau filter lain.' : 'Tambahkan tugas pertamamu dan mulai petualangan.'}</span></div>`;
    } else {
      list.innerHTML = visible.map((t) => {
        const groupList = t.done ? doneTasks : activeTasks;
        const posInGroup = groupList.findIndex(item => item.id === t.id);
        const canDrag = !isFiltering && !t.done;

        return `
        <article class="task ${t.done ? 'done' : ''} ${canDrag ? 'draggable' : ''}"
                 data-id="${t.id}"
                 draggable="${canDrag}">
          <div class="drag-handle" title="${canDrag ? 'Seret untuk mengubah urutan' : 'Selesaikan filter/pencarian untuk menggeser'}">⋮⋮</div>
          <button class="check" data-action="toggle" data-id="${t.id}" aria-label="Tandai selesai">${t.done ? '✓' : ''}</button>
          <div>
            <div class="task-title">${escapeHTML(t.title)}</div>
            ${t.desc ? `<div class="task-desc">${escapeHTML(t.desc)}</div>` : ''}
            <div class="task-meta">
              <span class="tag ${t.priority}">${t.priority==='high'?'🔥 PENTING':t.priority==='medium'?'⚡ NORMAL':'🌱 SANTAI'}</span>
              ${t.date ? `<span class="tag">📅 ${escapeHTML(formatDate(t.date))}</span>` : ''}
            </div>
          </div>
          <div class="task-actions">
            ${!t.done && !isFiltering ? `
              <button class="icon-btn move-btn" data-action="up" data-id="${t.id}" ${posInGroup === 0 ? 'disabled' : ''} title="Geser ke atas" aria-label="Geser ke atas">▲</button>
              <button class="icon-btn move-btn" data-action="down" data-id="${t.id}" ${posInGroup === groupList.length - 1 ? 'disabled' : ''} title="Geser ke bawah" aria-label="Geser ke bawah">▼</button>
            ` : ''}
            <button class="icon-btn" data-action="edit" data-id="${t.id}" aria-label="Edit">✏️</button>
            <button class="icon-btn" data-action="delete" data-id="${t.id}" aria-label="Hapus">🗑️</button>
          </div>
        </article>`;
      }).join('');
    }
  }

  // Event Listeners untuk Drag & Drop
  const taskListEl = $('taskList');

  taskListEl.addEventListener('dragstart', e => {
    const card = e.target.closest('.task.draggable');
    if (!card) { e.preventDefault(); return; }
    draggedId = card.dataset.id;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedId);
  });

  taskListEl.addEventListener('dragover', e => {
    e.preventDefault();
    const targetCard = e.target.closest('.task.draggable');
    document.querySelectorAll('.task').forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));

    if (!targetCard || targetCard.dataset.id === draggedId) return;
    const rect = targetCard.getBoundingClientRect();
    const isAfter = (e.clientY - rect.top) > (rect.height / 2);
    targetCard.classList.add(isAfter ? 'drag-over-bottom' : 'drag-over-top');
  });

  taskListEl.addEventListener('dragleave', e => {
    const targetCard = e.target.closest('.task');
    if (targetCard && !targetCard.contains(e.relatedTarget)) {
      targetCard.classList.remove('drag-over-top', 'drag-over-bottom');
    }
  });

  taskListEl.addEventListener('drop', e => {
    e.preventDefault();
    const targetCard = e.target.closest('.task.draggable');
    document.querySelectorAll('.task').forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom', 'dragging'));

    if (!targetCard || !draggedId || targetCard.dataset.id === draggedId) return;
    const rect = targetCard.getBoundingClientRect();
    const isAfter = (e.clientY - rect.top) > (rect.height / 2);
    moveTask(draggedId, targetCard.dataset.id, isAfter);
    draggedId = null;
    notify('↕️ Urutan quest diperbarui!');
  });

  taskListEl.addEventListener('dragend', () => {
    draggedId = null;
    document.querySelectorAll('.task').forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom', 'dragging'));
  });

  $('taskForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = titleInput.value.trim();
    if (!title) return;
    if (editingId) {
      const task = tasks.find(t => t.id === editingId);
      if (task) Object.assign(task,{title,desc:descInput.value.trim(),date:dateInput.value,priority:priorityInput.value});
      notify('✏️ Quest berhasil diperbarui!');
    } else {
      tasks.unshift({id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random())),title,desc:descInput.value.trim(),date:dateInput.value,priority:priorityInput.value,done:false,createdAt:Date.now()});
      notify('🎉 Quest baru ditambahkan!');
    }
    resetForm(); saveTasks();
  });

  function resetForm() {
    editingId=null; $('taskForm').reset(); priorityInput.value='medium';
    $('formHeading').textContent='+ NEW QUEST'; $('submitBtn').textContent='⚔ TAMBAH QUEST'; $('cancelEdit').style.display='none';
  }
  $('cancelEdit').addEventListener('click',resetForm);

  taskListEl.addEventListener('click', e => {
    const btn=e.target.closest('button[data-action]'); if(!btn)return;
    const task=tasks.find(t=>t.id===btn.dataset.id); if(!task)return;
    const action=btn.dataset.action;

    if(action==='up' || action==='down'){
      const activeTasks = tasks.filter(t => !t.done);
      const idx = activeTasks.findIndex(t => t.id === task.id);
      if(action === 'up' && idx > 0){
        moveTask(task.id, activeTasks[idx - 1].id, false);
      } else if(action === 'down' && idx < activeTasks.length - 1){
        moveTask(task.id, activeTasks[idx + 1].id, true);
      }
      return;
    }

    if(action==='toggle'){task.done=!task.done;notify(task.done?'🏆 Quest diselesaikan!':'Quest dibuka kembali.');saveTasks();}
    if(action==='delete' && confirm(`Hapus quest "${task.title}"?`)){tasks=tasks.filter(t=>t.id!==task.id);if(editingId===task.id)resetForm();saveTasks();notify('Quest dihapus.');}
    if(action==='edit'){
      editingId=task.id;titleInput.value=task.title;descInput.value=task.desc||'';dateInput.value=task.date||'';priorityInput.value=task.priority||'medium';
      $('formHeading').textContent='✎ EDIT QUEST';$('submitBtn').textContent='💾 SIMPAN PERUBAHAN';$('cancelEdit').style.display='block';
      titleInput.focus();window.scrollTo({top:0,behavior:'smooth'});
    }
  });

  document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{
    filter=btn.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===btn));render();
  }));
  $('searchInput').addEventListener('input',render);
  $('clearDone').addEventListener('click',()=>{
    const count=tasks.filter(t=>t.done).length;
    if(!count){notify('Belum ada quest selesai.');return;}
    if(confirm(`Hapus ${count} quest yang sudah selesai?`)){tasks=tasks.filter(t=>!t.done);saveTasks();notify('Quest selesai dibersihkan!');}
  });
  $('today').textContent=new Date().toLocaleDateString('id-ID',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
  render();
})();
</script>
</body>
</html>
